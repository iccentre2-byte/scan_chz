name: Build CHZ pilot (no publishing)
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["app/**", "companion_pc/**", "tests/**", "*.gradle", "gradle/**", ".github/workflows/build.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r companion_pc/requirements.txt
      - run: python -m unittest discover -s tests -v
  android-pilot:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test pilot (different applicationId; does not replace v1.2.4)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CHZ-1.3.0-rc1-pilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CHZ-Android-1.3.0-rc1-pilot
          path: dist/*.apk
  windows-helper:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests and EXE
        working-directory: companion_pc
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          python -m PyInstaller --clean --noconfirm --onefile --name CHZ_PC_Helper --hidden-import qrcode.image.svg --collect-all cryptography --add-data "web:web" --add-data "signer.ps1:." server.py
          Copy-Item Start_PC.cmd dist/
          Copy-Item Firewall_PRIVATE.cmd dist/
          Copy-Item README_PC_RU.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: CHZ-Windows-helper-1.3.0-rc1
          path: companion_pc/dist/*

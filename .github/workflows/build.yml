name: Build CHZ 1.3.3 safely
on:
  workflow_dispatch:
  push:
    branches: [main, codex/feedback-batch-133]
    paths: ["app/**", "companion_pc/**", "tests/**", "tools/**", "*.gradle", "gradle/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["app/**", "companion_pc/**", "tests/**", "tools/**", "*.gradle", "gradle/**", ".github/workflows/build.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r companion_pc/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/helper_ui.cjs
  android:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      CHZ_SIGNING_PASSWORD: ${{ secrets.CHZ_SIGNING_PASSWORD }}
      CHZ_SIGNING_ALIAS: ${{ secrets.CHZ_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Load private signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.CHZ_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$CHZ_SIGNING_PASSWORD" && test -n "$CHZ_SIGNING_ALIAS"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/chz-signing.p12"
          printf 'CHZ_SIGNING_KEYSTORE=%s/chz-signing.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build stable signed APKs
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew --no-daemon assembleRelease assemblePilotUpdate
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CHZ-1.3.3-safe.apk
          cp app/build/outputs/apk/pilotUpdate/app-pilotUpdate.apk dist/CHZ-1.3.3-pilot-update.apk
          python tools/release_manifest.py dist "$GITHUB_SHA" "$ANDROID_HOME/build-tools/34.0.0"
          cp tools/*.ps1 tools/*.cmd tools/signing-certificate-sha256.txt dist/
          cp docs/INSTALL_1_3_1_RU.txt dist/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CHZ-Android-1.3.3-verified
          path: dist/*
          if-no-files-found: error
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/chz-signing.p12"
  windows-helper:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Windows backup tools
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_tools.ps1
      - name: Build helper
        working-directory: companion_pc
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          python -m PyInstaller --clean --noconfirm --onefile --name CHZ_PC_Helper --hidden-import qrcode.image.svg --collect-all cryptography --add-data "web:web" --add-data "signer.ps1:." server.py
          Copy-Item Start_PC.cmd dist/
          Copy-Item Firewall_PRIVATE.cmd dist/
          Copy-Item README_PC_RU.md dist/
          Copy-Item ../docs/HELPER_UPDATE_1_3_3_RU.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: CHZ-Windows-helper-1.3.3
          path: companion_pc/dist/*

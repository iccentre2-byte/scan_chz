plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tsd.czsetcollector'
    compileSdk 34

    defaultConfig {
        applicationId "com.tsd.czsetcollector"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.3.3"
        resValue "string", "app_name", "ЧЗ: Наборы"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stable {
            def keyPath = System.getenv('CHZ_SIGNING_KEYSTORE')
            if (keyPath) storeFile file(keyPath)
            storePassword System.getenv('CHZ_SIGNING_PASSWORD')
            keyAlias System.getenv('CHZ_SIGNING_ALIAS')
            keyPassword System.getenv('CHZ_SIGNING_PASSWORD')
        }
    }

    buildTypes {
        release {
            applicationIdSuffix '.safe'
            resValue 'string', 'app_name', 'ЧЗ: Наборы 1.3.3'
            signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'ЧЗ: Наборы — разработка'
            minifyEnabled false
        }
        pilotUpdate {
            initWith release
            applicationIdSuffix '.pilot'
            resValue 'string', 'app_name', 'ЧЗ: Наборы — пилот'
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
